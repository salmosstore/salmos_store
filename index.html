<!doctype html>
<html lang="es-AR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="SALMOS · creer · amar · crear · remeras y más">
  <meta property="og:site_name" content="SALMOS">
  <meta property="og:locale" content="es_AR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SALMOS — Tienda">
  <meta property="og:description" content="SALMOS · creer · amar · crear · remeras y más">
  <meta property="og:url" content="https://salmos.com.ar/">
  <meta property="og:image" content="https://salmos.com.ar/banner-salmos.png">
  <meta property="og:image:alt" content="SALMOS · creer · amar · crear · remeras y más">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SALMOS — Tienda">
  <meta name="twitter:description" content="SALMOS · creer · amar · crear · remeras y más">
  <meta name="twitter:image" content="https://salmos.com.ar/banner-salmos.png">
  <link rel="canonical" href="https://salmos.com.ar/">
  <title>SALMOS — Tienda</title>
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-stack">
      <div class="brand-theme-row">
        <a class="brand brand-icon-only" href="/" aria-label="SALMOS inicio">
          <img class="brand-icon brand-icon-dark" src="logo-mark.png" alt="SALMOS">
          <img class="brand-icon brand-icon-light" src="logo-light.png" alt="SALMOS">
        </a>
        <button class="icon-btn" id="themeBtn" aria-label="Cambiar modo claro u oscuro" title="Modo claro / oscuro">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>

      <div class="shopping-row">
        <label class="search-box" aria-label="Buscar en SALMOS">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar en SALMOS...">
        </label>
        <div class="header-actions compact-actions">
          <button class="icon-btn account-btn" id="accountBtn" aria-label="Ingresar o ver mi cuenta" title="Mi cuenta">
            <span id="accountButtonContent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          </button>
          <button class="icon-btn" id="cartBtn" aria-label="Carrito" title="Carrito">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/></svg>
            <span class="badge hidden" id="cartBadge">0</span>
          </button>
        </div>
      </div>

      <nav class="category-bar hidden" id="categoryBar" aria-label="Categorías">
        <div class="category-row" id="categoryRow"></div>
      </nav>
    </div>
  </header>

  <main>
    <div class="shell">
      <section class="hero hero-compact" aria-label="SALMOS">
        <img src="banner-salmos.png" alt="SALMOS · creer · amar · crear · remeras y más">
      </section>

      <section class="section products-section" id="productos">
        <div class="products-meta-hidden" aria-hidden="true">
          <h2 id="productsTitle">Productos</h2>
          <p id="productsSubtitle"></p>
          <button id="clearFiltersBtn" class="hidden" type="button">Limpiar</button>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>

      <section class="section hidden" id="featuredSection" aria-hidden="true"><div id="featuredGrid"></div></section>

      <section class="store-bottom" aria-label="Información de envíos y SALMOS">
        <article class="delivery-promo">
          <div class="delivery-promo-kicker">Ezeiza y alrededores</div>
          <h2>Envíos en el día</h2>
          <p>Consultá el costo de envío al comprar. Para cuidar el servicio, cada dispositivo puede realizar hasta <strong>3 cotizaciones por día</strong>.</p>
          <a class="btn btn-whatsapp" id="footerWhatsapp" href="#" target="_blank" rel="noopener">
            <span class="whatsapp-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="18" height="18" fill="currentColor"><path d="M16.04 3C9.4 3 4 8.3 4 14.82c0 2.29.68 4.52 1.96 6.43L4 28l6.96-1.82a12.2 12.2 0 0 0 5.07 1.1h.01C22.67 27.28 28 21.98 28 15.45 28 8.93 22.67 3 16.04 3Zm0 21.93h-.01a9.83 9.83 0 0 1-5.01-1.37l-.36-.21-4.13 1.08 1.1-4-.24-.41a9.67 9.67 0 0 1-1.5-5.2c0-5.3 4.5-9.6 10.03-9.6 5.52 0 9.98 4.83 9.98 10.23 0 5.3-4.43 9.48-9.96 9.48Zm5.47-7.1c-.3-.15-1.78-.86-2.05-.96-.28-.1-.48-.15-.68.15-.2.29-.78.96-.95 1.16-.18.2-.35.22-.65.07-.3-.15-1.26-.45-2.4-1.44a8.8 8.8 0 0 1-1.66-2.03c-.18-.29-.02-.45.13-.6.14-.13.3-.34.45-.51.15-.17.2-.29.3-.49.1-.19.05-.36-.03-.51-.07-.15-.67-1.58-.92-2.17-.24-.56-.49-.49-.68-.5h-.57c-.2 0-.52.07-.8.36-.27.29-1.05 1-1.05 2.45 0 1.44 1.08 2.84 1.23 3.04.15.19 2.12 3.17 5.14 4.45.72.3 1.28.48 1.72.62.72.22 1.38.19 1.9.11.58-.08 1.78-.71 2.03-1.39.25-.68.25-1.26.18-1.39-.08-.12-.28-.19-.58-.34Z"/></svg></span> Contactar por WhatsApp
          </a>
          <button class="btn btn-ghost flyers-launch hidden" id="flyersLaunchBtn" type="button">FLYERS</button>
          <a class="btn btn-ghost admin-only-link hidden" id="adminOnlyLink" href="/admin.html">Administración</a>
        </article>
        <div class="bottom-seal-wrap"><img class="bottom-seal" src="sello-gloria.png" alt="Con toda su gloria"></div>
      </section>

      <section class="flyers-public hidden" id="flyersSection" aria-label="Flyers de SALMOS">
        <div class="flyers-public-head"><h2>Flyers</h2><button class="btn btn-ghost" id="closeFlyersBtn" type="button">Cerrar</button></div>
        <div class="flyer-scroll" id="flyerScroll"></div>
      </section>
    </div>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="cartDrawer" aria-label="Carrito">
    <div class="drawer-head"><h3>Carrito</h3><button class="icon-btn" id="closeCartBtn" aria-label="Cerrar">×</button></div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-foot"><div class="total-row grand"><span>Subtotal</span><strong id="cartSubtotal">$ 0</strong></div><button class="btn btn-primary full" id="checkoutBtn">Continuar compra</button></div>
  </aside>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <section class="modal product-modal" id="productModal" aria-label="Detalle del producto"></section>
  <section class="modal checkout-modal" id="checkoutModal" aria-label="Finalizar compra">
    <div class="checkout-wrap">
      <div class="checkout-progress" aria-hidden="true"><span class="step"></span><span class="step"></span><span class="step"></span></div>
      <button class="icon-btn checkout-close" id="closeCheckoutBtn" aria-label="Cerrar">×</button>
      <div id="checkoutContent"></div>
    </div>
  </section>

  <button id="footerCartBtn" class="hidden" type="button" aria-hidden="true"></button>
  <span id="year" class="hidden" aria-hidden="true"></span>
  <div class="toast-stack" id="toastStack"></div>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
