<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>SALMOS — Administración</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=9.0">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-v4.css?v=9.0">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-brand"><img src="logo-mark.png" alt=""><div><strong>SALMOS</strong><small>Administración</small></div></div>
      <nav class="admin-nav">
        <button class="admin-nav-btn active" data-view="dashboard">⌂ <span>Dashboard</span></button>
        <button class="admin-nav-btn" data-view="products">◫ <span>Productos</span></button>
        <button class="admin-nav-btn" data-view="orders">▤ <span>Órdenes</span></button>
        <button class="admin-nav-btn" data-view="customOrders">✦ <span>Pedidos</span></button>
        <button class="admin-nav-btn" data-view="stock">◈ <span>Stock</span></button>
        <button class="admin-nav-btn" data-view="designs">◩ <span>Diseños</span></button>
        <button class="admin-nav-btn" data-view="coupons">🎟 <span>Cupones</span></button>
        <button class="admin-nav-btn" data-view="categories">▦ <span>Categorías</span></button>
        <button class="admin-nav-btn" data-view="expenses">↕ <span>Caja</span></button>
        <button class="admin-nav-btn" data-view="flyers">▣ <span>Flyers</span></button>
        <button class="admin-nav-btn" data-view="settings">⚙ <span>Configuración</span></button>
      </nav>
      <a class="btn btn-ghost full" href="/">Ver tienda</a>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button class="icon-btn admin-menu-btn" id="adminMenuBtn" type="button">☰</button>
        <div><div class="admin-eyebrow">Panel SALMOS</div><h1 id="viewTitle">Dashboard</h1></div>
        <button class="icon-btn" id="adminThemeBtn" type="button" title="Cambiar tema">◐</button>
      </header>
      <section class="admin-content" id="adminContent"><div class="empty-state"><strong>Cargando panel...</strong></div></section>
    </main>
  </div>

  <dialog class="admin-dialog" id="productDialog">
    <form method="dialog" class="dialog-shell" id="productForm">
      <div class="dialog-head"><div><div class="admin-eyebrow">Producto</div><h2 id="productDialogTitle">Nuevo producto</h2></div><button class="icon-btn" value="cancel">×</button></div>
      <div class="dialog-body" id="productFormBody"></div>
      <div class="dialog-foot"><button class="btn btn-ghost" value="cancel">Cancelar</button><button class="btn btn-primary" id="saveProductBtn" value="default">Guardar producto</button></div>
    </form>
  </dialog>

  <dialog class="admin-dialog small" id="movementDialog">
    <form method="dialog" class="dialog-shell" id="movementForm">
      <div class="dialog-head"><div><div class="admin-eyebrow">Caja</div><h2 id="movementDialogTitle">Nuevo ingreso / egreso</h2></div><button class="icon-btn" value="cancel" formnovalidate>×</button></div>
      <div class="dialog-body">
        <div class="form-grid">
          <div class="field"><label>Tipo</label><select class="select" name="type"><option value="expense">Egreso</option><option value="income">Ingreso</option></select></div>
          <div class="field"><label>Fecha</label><input class="input" name="date" type="date" required></div>
          <div class="field"><label>Motivo / etiqueta</label><input class="input" name="category" list="financeReasonTags" placeholder="Ej.: Venta, Compra, Aporte, Gasto" required><datalist id="financeReasonTags"><option value="Venta"><option value="Compra"><option value="Aporte"><option value="Gasto"></datalist></div>
          <div class="field full"><label>Detalle</label><input class="input" name="description" placeholder="Ej.: 8 remeras para..., compra de bolsas..." required></div>
          <div class="field"><label>Origen</label><input class="input" name="origin" placeholder="Ej.: Caja SALMOS, Mercado Pago"></div>
          <div class="field"><label>Destino</label><input class="input" name="destination" placeholder="Ej.: Proveedor, imprenta"></div>
          <div class="field"><label>Importe</label><input class="input" name="amount" type="number" min="0" step="1" required></div>
          <div class="field full"><label>Comprobantes / imágenes (opcional)</label><input class="input" name="attachments" type="file" accept="image/*" multiple><small class="field-help">Podés adjuntar fotos de tickets, comprobantes o capturas.</small></div>
        </div>
      </div>
      <div class="dialog-foot"><button class="btn btn-ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn btn-primary" id="saveMovementBtn" value="default">Guardar</button></div>
    </form>
  </dialog>

  <dialog class="admin-dialog design-preview-dialog" id="designPreviewDialog">
    <div class="dialog-shell">
      <div class="dialog-head"><div><div class="admin-eyebrow">Diseño original</div><h2 id="designPreviewTitle">Vista previa</h2></div><button class="icon-btn" type="button" id="closeDesignPreviewBtn">×</button></div>
      <div class="dialog-body"><div class="design-preview-stage" id="designPreviewStage"></div><div class="design-preview-meta" id="designPreviewMeta"></div></div>
    </div>
  </dialog>

  <div class="toast-stack" id="toastStack"></div>
  <script src="config.js"></script>
  <script src="admin.js?v=9.0" defer></script>
  <script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));</script>
</body>
</html>
