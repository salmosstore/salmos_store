<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SALMOS — Tienda</title>
  <script>
    (async function () {
      try {
        const response = await fetch('/index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar la tienda');
        let html = await response.text();
        html = html.replace(/<head([^>]*)>/i, '<head$1><base href="/">');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        location.replace('/');
      }
    })();
  </script>
</head>
<body></body>
</html>
